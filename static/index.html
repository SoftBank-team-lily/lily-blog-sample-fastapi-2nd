<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lily Blog</title>
<style>
  :root { --bg: #0e0f11; --fg: #ecebe6; --muted: #8a8a86; --line: #26282c; --lily: #f3efe4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 56px 20px 80px; }
  header { text-align: center; margin-bottom: 40px; }
  svg { width: 72px; height: 72px; color: var(--lily); }
  h1 { font-size: 20px; font-weight: 600; margin: 12px 0 0; letter-spacing: .02em; }
  .toggle { display: block; margin: 0 auto 24px; background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 8px 20px; border-radius: 999px; font-weight: 500; }
  .toggle:hover { border-color: var(--muted); }
  .composer { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .35s ease, opacity .35s ease, margin .35s ease; }
  .composer.open { grid-template-rows: 1fr; opacity: 1; margin-bottom: 40px; }
  .composer > div { overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { .composer { transition: none; } }
  form { display: grid; gap: 10px; padding: 2px; }
  input, textarea { width: 100%; background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: inherit; }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--muted); }
  button { background: var(--lily); color: var(--bg); border: 0; border-radius: 8px; padding: 12px; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .post { border-top: 1px solid var(--line); padding: 20px 0; }
  .post h2 { font-size: 16px; margin: 0 0 6px; }
  .post p { margin: 0; white-space: pre-wrap; }
  .post time, .empty, .error { color: var(--muted); font-size: 13px; }
  .error { min-height: 1em; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
      <g transform="translate(50 50)">
        <path d="M0 0 C 8 -14, 6 -30, 0 -40 C -6 -30, -8 -14, 0 0 Z"/>
        <path transform="rotate(60)" d="M0 0 C 8 -14, 6 -30, 0 -40 C -6 -30, -8 -14, 0 0 Z"/>
        <path transform="rotate(120)" d="M0 0 C 8 -14, 6 -30, 0 -40 C -6 -30, -8 -14, 0 0 Z"/>
        <path transform="rotate(180)" d="M0 0 C 8 -14, 6 -30, 0 -40 C -6 -30, -8 -14, 0 0 Z"/>
        <path transform="rotate(240)" d="M0 0 C 8 -14, 6 -30, 0 -40 C -6 -30, -8 -14, 0 0 Z"/>
        <path transform="rotate(300)" d="M0 0 C 8 -14, 6 -30, 0 -40 C -6 -30, -8 -14, 0 0 Z"/>
        <circle r="3" fill="currentColor"/>
      </g>
    </svg>
    <h1>Lily Blog</h1>
  </header>

  <button class="toggle" id="toggle" type="button" aria-expanded="false" aria-controls="composer">글쓰기</button>

  <div class="composer" id="composer">
    <div>
      <form id="form">
        <input id="title" placeholder="제목" maxlength="120" required tabindex="-1">
        <textarea id="body" placeholder="내용" maxlength="5000" required tabindex="-1"></textarea>
        <button id="submit" tabindex="-1">올리기</button>
        <div class="error" id="error"></div>
      </form>
    </div>
  </div>

  <section id="posts"></section>
</main>
<script>
  const $ = (id) => document.getElementById(id);

  function setOpen(open) {
    $("composer").classList.toggle("open", open);
    $("toggle").setAttribute("aria-expanded", open);
    $("toggle").textContent = open ? "닫기" : "글쓰기";
    for (const el of $("form").elements) el.tabIndex = open ? 0 : -1;
    if (open) $("title").focus({ preventScroll: true });
  }

  $("toggle").addEventListener("click", () => setOpen(!$("composer").classList.contains("open")));

  async function load() {
    const res = await fetch("/api/posts");
    const posts = await res.json();
    const list = $("posts");
    list.replaceChildren();
    if (!posts.length) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "아직 글이 없습니다. 첫 글을 남겨 보세요.";
      list.append(p);
      return;
    }
    for (const post of posts) {
      const el = document.createElement("article");
      el.className = "post";
      const h = document.createElement("h2");
      h.textContent = post.title;
      const t = document.createElement("time");
      t.textContent = post.createdAt.slice(0, 16).replace("T", " ");
      const p = document.createElement("p");
      p.textContent = post.body;
      el.append(h, t, p);
      list.append(el);
    }
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("submit").disabled = true;
    $("error").textContent = "";
    try {
      const res = await fetch("/api/posts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: $("title").value, body: $("body").value }),
      });
      if (!res.ok) throw new Error();
      $("form").reset();
      setOpen(false);
      await load();
    } catch {
      $("error").textContent = "글을 저장하지 못했습니다. 잠시 뒤 다시 시도해 주세요.";
    } finally {
      $("submit").disabled = false;
    }
  });

  load();
</script>
</body>
</html>
